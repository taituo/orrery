# Fake OpenAI-compatible model server inside the cluster (CI): an Orrery provider OpenCode bots
# use as orrery-fake/fake-small.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-models
  labels: { app: fake-models }
spec:
  replicas: 1
  selector: { matchLabels: { app: fake-models } }
  template:
    metadata: { labels: { app: fake-models } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: fake-models
          image: ghcr.io/taituo/orrery-computer-mock:ci
          imagePullPolicy: Never
          command: ["node", "/opt/orrery/mock/fake-models.js", "8000"]
          env: [{ name: HOST, value: 0.0.0.0 }]
          ports: [{ containerPort: 8000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /v1/models, port: 8000 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-models
spec:
  selector: { app: fake-models }
  ports: [{ port: 8000, targetPort: 8000 }]
