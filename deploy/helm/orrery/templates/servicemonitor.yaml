{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $fullname := include "orrery.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-worker-metrics
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-metrics
spec:
  clusterIP: None
  selector:
    orrery.dev/role: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker-metrics
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
