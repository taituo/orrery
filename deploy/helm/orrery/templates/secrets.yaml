{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "orrery.secretName" . }}
{{- $dbUrl := .Values.config.database.url }}
{{- if and .Values.postgresql.enabled (not $dbUrl) }}
{{- $dbUrl = printf "postgres://orrery:%s@%s-postgresql.%s.svc:5432/orrery" (include "orrery.postgresPassword" .) (include "orrery.fullname" .) .Release.Namespace }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mcp-token-secret: {{ include "orrery.platformSecret" (dict "ctx" $ "key" "mcp-token-secret" "gen" (randAlphaNum 48)) }}
  gateway-token-secret: {{ include "orrery.platformSecret" (dict "ctx" $ "key" "gateway-token-secret" "gen" (randAlphaNum 48)) }}
  # 32 random bytes as base64 (AES-256-GCM key for secrets stored in Postgres)
  encryption-key: {{ include "orrery.platformSecret" (dict "ctx" $ "key" "encryption-key" "gen" (randAlphaNum 32 | b64enc)) }}
  {{- if $dbUrl }}
  database-url: {{ $dbUrl | b64enc }}
  {{- else if not .Values.config.database.existingSecret }}
  {{- fail "set config.database.url, config.database.existingSecret, or postgresql.enabled" }}
  {{- end }}
  {{- if and .Values.config.langfuse.publicKey (not .Values.config.langfuse.existingSecret) }}
  langfuse-public-key: {{ .Values.config.langfuse.publicKey | b64enc }}
  langfuse-secret-key: {{ required "config.langfuse.secretKey is required with publicKey" .Values.config.langfuse.secretKey | b64enc }}
  {{- end }}
  {{- with .Values.config.devAuthToken }}
  dev-auth-token: {{ . | b64enc }}
  {{- end }}
{{- end }}
