name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: install OpenCode (real-binary ACP tests)
        run: npm install -g --no-fund --no-audit opencode-ai@1.19.5 && opencode --version
      - name: tests (unit, Postgres/pgvector, gateway, API, Temporal workflows, OpenCode over ACP)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEMPORAL_TEST: "1"
          OPENCODE_TEST: "1"
      - name: build web console and clickable prototype
        run: |
          pnpm --filter @orrery/web build
          pnpm --filter @orrery/web build:prototype
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-prototype
          path: apps/web/dist-prototype/index.html

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: lint
        run: |
          helm lint deploy/helm/orrery --set config.database.url=postgres://u:p@db/orrery
          helm lint deploy/helm/orrery -f deploy/helm/orrery/values-dev.yaml
      - name: render and validate against Kubernetes schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in "--set config.database.url=postgres://u:p@db/orrery" \
                        "-f deploy/helm/orrery/values-dev.yaml" \
                        "--set config.database.url=postgres://u:p@db/orrery --set worker.keda.enabled=true --set computers.cilium=true --set metrics.serviceMonitor.enabled=true"; do
            helm template orrery deploy/helm/orrery --namespace orrery $values > rendered.yaml
            ./kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ScaledObject,CiliumNetworkPolicy,ServiceMonitor rendered.yaml
          done

  kiro-install:
    name: kiro-cli install + ACP probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional repository secret: with it the probe also opens a real session (modes, models).
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: install kiro-cli the way the computer image does
        run: |
          set +e
          docker run --rm -e KIRO_API_KEY -v "$PWD/deploy/docker:/s:ro" -v "$PWD/scripts:/scripts:ro" node:22-bookworm-slim bash -c \
            'apt-get update -qq && apt-get install -y -qq curl unzip ca-certificates >/dev/null && bash /s/install-kiro-cli.sh \
             && echo "--- ACP probe (credentials: $([ -n "$KIRO_API_KEY" ] && echo yes || echo no)) ---" && node /scripts/probe-kiro-acp.mjs kiro-cli both' > kiro-install.log 2>&1
          status=$?
          cat kiro-install.log
          msg=$(sed -n '/--- ACP probe/,$p' kiro-install.log | head -c 60000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          [ -n "$msg" ] || msg=$(tail -c 3500 kiro-install.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ $status -eq 0 ]; then echo "::notice title=kiro-cli install::$msg"; else echo "::error title=kiro-cli install::$msg"; fi
          exit $status

  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web, computer, computer-mock]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orrery-${{ matrix.target }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  e2e:
    name: end-to-end (compose + mock Kiro)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test]
    env:
      ORRERY_COMPUTER_TARGET: computer-mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: start the stack
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee compose-up.txt || {
            msg=$(tail -c 8000 compose-up.txt | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose up::$msg"; exit 1; }
      - name: end-to-end turn, approval, session reuse, worker crash and resume
        run: >
          node scripts/e2e.mjs --api http://localhost:8090 --token dev-token --mock --timeout 240
          --crash-cmd "docker compose kill -s SIGKILL worker"
          --restart-cmd "docker compose up -d worker"
      - name: console is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: logs
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail 120 > compose-logs.txt 2>&1 || true
          cat compose-ps.txt compose-logs.txt
          for f in compose-ps.txt compose-logs.txt; do
            msg=$(tail -c 12000 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done

  e2e-opencode:
    name: end-to-end (compose + real OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    env:
      ORRERY_COMPUTER_TARGET: computer
      ORRERY_AGENT_KIND: opencode
      COMPOSE_PROFILES: fake-models
      # OpenCode's model: the fake OpenAI-compatible server (scripted tool calls).
      OPENCODE_CONFIG_CONTENT: >-
        {"provider":{"fake":{"npm":"@ai-sdk/openai-compatible","name":"Fake","options":{"baseURL":"http://fake-models:8000/v1","apiKey":"unused"},"models":{"fake-small":{"name":"fake-small","tool_call":true}}}},
        "model":"fake/fake-small","permission":{"*":"ask"},
        "agent":{"build":{"permission":{"*":"ask"}},"plan":{"permission":{"*":"ask"}},"general":{"permission":{"*":"ask"}},"explore":{"permission":{"*":"ask"}}},
        "autoupdate":false,"share":"disabled"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: start the stack with OpenCode
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 420 2>&1 | tee compose-up.txt || {
            msg=$(tail -c 8000 compose-up.txt | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose up::$msg"; exit 1; }
      - name: end-to-end turn, approval, session reuse, worker crash while waiting for approval
        run: >
          node scripts/e2e.mjs --api http://localhost:8090 --token dev-token --agent opencode --timeout 300
          --crash-cmd "docker compose kill -s SIGKILL worker"
          --restart-cmd "docker compose up -d worker"
      - name: logs
        if: failure()
        run: |
          docker compose ps -a > compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail 150 > compose-logs.txt 2>&1 || true
          cat compose-ps.txt compose-logs.txt
          for f in compose-ps.txt compose-logs.txt; do
            msg=$(tail -c 12000 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done

  kubernetes:
    name: kubernetes (kind + helm install, out of the box)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [test]
    env:
      NS: orrery
    steps:
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" && df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v3
      - { name: build api, uses: docker/build-push-action@v6, with: { context: ., file: deploy/docker/Dockerfile, target: api, load: true, tags: "ghcr.io/taituo/orrery-api:ci", cache-from: "type=gha,scope=api" } }
      - { name: build worker, uses: docker/build-push-action@v6, with: { context: ., file: deploy/docker/Dockerfile, target: worker, load: true, tags: "ghcr.io/taituo/orrery-worker:ci", cache-from: "type=gha,scope=worker" } }
      - { name: build web, uses: docker/build-push-action@v6, with: { context: ., file: deploy/docker/Dockerfile, target: web, load: true, tags: "ghcr.io/taituo/orrery-web:ci", cache-from: "type=gha,scope=web" } }
      - { name: build computer, uses: docker/build-push-action@v6, with: { context: ., file: deploy/docker/Dockerfile, target: computer, load: true, tags: "ghcr.io/taituo/orrery-computer:ci", cache-from: "type=gha,scope=computer" } }
      - { name: build computer-mock, uses: docker/build-push-action@v6, with: { context: ., file: deploy/docker/Dockerfile, target: computer-mock, load: true, tags: "ghcr.io/taituo/orrery-computer-mock:ci", cache-from: "type=gha,scope=computer-mock" } }
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: orrery
          config: deploy/ci/kind.yaml
          wait: 0s
      - name: Calico (enforced NetworkPolicies)
        run: |
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: load images into the cluster
        run: for t in api worker web computer computer-mock; do kind load docker-image --name orrery ghcr.io/taituo/orrery-$t:ci; done
      - name: helm install (chart defaults + CI images and a fake model provider)
        run: |
          kubectl create namespace $NS
          kubectl -n $NS apply -f deploy/ci/fake-models.yaml
          helm install orrery deploy/helm/orrery -n $NS -f deploy/ci/values-kind.yaml --wait --timeout 15m
          kubectl -n $NS get pods -o wide
      - name: console, API, CLI and MCP through one port-forward
        run: |
          kubectl -n $NS port-forward svc/orrery-web 8080:8080 > pf.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/readyz
          TOKEN=$(kubectl -n $NS get secret orrery-platform -o jsonpath='{.data.admin-token}' | base64 -d)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsSLo orrery localhost:8080/cli/orrery.mjs && chmod +x orrery
          ./orrery login --url http://localhost:8080 --token "$TOKEN"
          ./orrery whoami
          ./orrery status
          # MCP for people: initialize, list tools, call one
          H=(-H "authorization: Bearer $TOKEN" -H "content-type: application/json" -H "accept: application/json, text/event-stream")
          curl -fsS "${H[@]}" localhost:8080/mcp -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | grep -q '"orrery"'
          curl -fsS "${H[@]}" localhost:8080/mcp -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | grep -q '"ask_bot"'
      - name: end to end on Kubernetes (mock Kiro computers; approval, session reuse, ACP worker rolled mid-turn, group hand-off)
        run: >
          node scripts/e2e.mjs --api http://localhost:8080 --token "$TOKEN" --mock --timeout 600
          --computer-image ghcr.io/taituo/orrery-computer-mock:ci
          --crash-cmd "kubectl -n $NS rollout restart deploy/orrery-worker-acp"
          --restart-cmd "kubectl -n $NS rollout status deploy/orrery-worker-acp --timeout=300s"
      - name: end to end on Kubernetes (real OpenCode on a platform provider; worker killed while waiting for approval)
        run: >
          node scripts/e2e.mjs --api http://localhost:8080 --token "$TOKEN" --agent opencode --model orrery-fake/fake-small --timeout 600
          --crash-cmd "kubectl -n $NS delete pod -l app.kubernetes.io/component=worker-acp --wait=false --grace-period=0 --force"
          --restart-cmd "kubectl -n $NS rollout status deploy/orrery-worker-acp --timeout=300s"
      - name: CLI against the cluster
        run: |
          ./orrery bots create cli-bot --engine opencode --model orrery-fake/fake-small
          ./orrery ask cli-bot "run: echo from-the-cli" --approve | tee ask.txt
          grep -q from-the-cli ask.txt
          ./orrery tokens create ci-token --role member > member.token
          ORRERY_TOKEN=$(cat member.token) ./orrery whoami | grep -q member
      - name: helm upgrade keeps secrets and data
        run: |
          helm upgrade orrery deploy/helm/orrery -n $NS -f deploy/ci/values-kind.yaml --wait --timeout 10m
          [ "$(kubectl -n $NS get secret orrery-platform -o jsonpath='{.data.admin-token}' | base64 -d)" = "$TOKEN" ]
          pkill -f "port-forward svc/orrery-web" || true
          kubectl -n $NS port-forward svc/orrery-web 8080:8080 > pf2.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz >/dev/null 2>&1 && break; sleep 2; done
          ./orrery bots | grep -q cli-bot
      - name: diagnostics
        if: failure()
        run: |
          mkdir -p diag
          kubectl get pods -A -o wide > diag/pods.txt 2>&1 || true
          { kubectl -n $NS get events --sort-by=.lastTimestamp | tail -40; kubectl -n orrery-computers get events --sort-by=.lastTimestamp | tail -40; } > diag/events.txt 2>&1 || true
          for d in api worker-agent worker-acp worker-memory web temporal; do
            kubectl -n $NS logs -l app.kubernetes.io/component=$d --tail=400 --all-containers --prefix > diag/$d.txt 2>&1 || true
            kubectl -n $NS logs -l app.kubernetes.io/component=$d --tail=400 --all-containers --prefix --previous >> diag/$d.txt 2>/dev/null || true
            grep -iE '"level":(40|50|60)|error|warn|fail' diag/$d.txt > diag/$d.problems.txt || true
          done
          for p in $(kubectl -n orrery-computers get pods -o name); do
            { echo "== $p"; kubectl -n orrery-computers describe $p | tail -25; kubectl -n orrery-computers logs $p --tail=120 2>&1; } >> diag/computers.txt
          done
          kubectl -n orrery-computers get all,secrets,cm,networkpolicy -o wide >> diag/computers.txt 2>&1 || true
          cat diag/*.txt
          a=deploy/ci/annotate.sh
          $a "api problems" diag/api.problems.txt
          $a "worker-acp problems" diag/worker-acp.problems.txt
          $a "worker-agent problems" diag/worker-agent.problems.txt
          $a "worker-acp log" diag/worker-acp.txt
          $a "computers" diag/computers.txt
          $a "events" diag/events.txt
          $a "pods" diag/pods.txt

  e2e-kiro:
    name: end-to-end with real kiro-cli (needs KIRO_API_KEY secret)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, kiro-install]
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
      ORRERY_COMPUTER_TARGET: computer
    steps:
      - uses: actions/checkout@v5
        if: env.KIRO_API_KEY != ''
      - uses: actions/setup-node@v5
        if: env.KIRO_API_KEY != ''
        with:
          node-version: 22
          package-manager-cache: false
      - name: start the stack with the real kiro-cli
        if: env.KIRO_API_KEY != ''
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: end-to-end turn against Kiro (V3 engine)
        if: env.KIRO_API_KEY != ''
        run: node scripts/e2e.mjs --api http://localhost:8090 --token dev-token --timeout 300
      - name: logs
        if: failure() && env.KIRO_API_KEY != ''
        run: docker compose logs --no-color --tail 400
      - name: skipped
        if: env.KIRO_API_KEY == ''
        run: echo "::notice title=e2e-kiro::Add a KIRO_API_KEY repository secret to run the end-to-end test against the real kiro-cli."
